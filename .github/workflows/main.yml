name: Hourly_Data_Siphon

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch: # Manual button for you

jobs:
  build:
    runs-on: ubuntu-latest
    # --- THE HARDCODE PATCH START ---
    permissions:
      contents: write
    # --- THE HARDCODE PATCH END ---
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install puppeteer-core --no-package-lock
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Run Siphon Script
        run: node scraper.js

      - name: Push Data to Repo
        run: |
          git config --local user.email "bot@njvb.com"
          git config --local user.name "SiphonBot"
          git add data.json
          git commit -m "||PAUSE...|| Data Siphoned [Automated Update]" || exit 0
          git push
