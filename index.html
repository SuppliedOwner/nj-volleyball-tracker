<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJVB HUB | Central Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .purple-glow { box-shadow: 0 0 20px rgba(147, 51, 234, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .active-tab { background: #9333ea !important; color: white !important; box-shadow: 0 10px 15px -3px rgba(147, 51, 234, 0.4); }
    </style>
</head>
<body class="min-h-screen selection:bg-purple-500/30">

    <header class="sticky top-0 z-50 bg-[#0f172a]/80 backdrop-blur-md border-b border-white/5">
        <div class="max-w-[1400px] mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-purple-600 rounded-xl shadow-lg shadow-purple-900/20">
                    <i data-lucide="zap" class="w-6 h-6 text-white fill-white/20"></i>
                </div>
                <span class="text-xl font-black tracking-tighter uppercase italic">NJVB<span class="text-purple-500">HUB</span></span>
            </div>
            
            <div class="hidden lg:block flex-1 max-w-xl mx-10">
                <p id="rotating-sub" class="text-[11px] font-bold text-slate-500 uppercase tracking-widest text-center transition-opacity duration-500">
                    Siphoning live state rankings...
                </p>
            </div>

            <div class="flex items-center gap-4">
                <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-slate-900/50 rounded-full border border-white/5">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span id="sync-status" class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Live</span>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-[1400px] mx-auto px-6 py-8 flex flex-col lg:flex-row gap-8">
        
        <aside class="lg:w-64 shrink-0 space-y-2">
            <button onclick="setTab('home')" id="btn-home" class="nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-xs font-black uppercase tracking-widest text-slate-400 hover:bg-white/5 transition-all">
                <i data-lucide="home" class="w-4 h-4"></i> Overview
            </button>
            <button onclick="setTab('rankings')" id="btn-rankings" class="nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-xs font-black uppercase tracking-widest text-slate-400 hover:bg-white/5 transition-all">
                <i data-lucide="list-ordered" class="w-4 h-4"></i> State Rankings
            </button>
            <button onclick="setTab('stats')" id="btn-stats" class="nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-xs font-black uppercase tracking-widest text-slate-400 hover:bg-white/5 transition-all">
                <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Player Stats
            </button>
            <button onclick="setTab('matches')" id="btn-matches" class="nav-btn w-full flex items-center gap-3 px-4 py-3.5 rounded-2xl text-xs font-black uppercase tracking-widest text-slate-400 hover:bg-white/5 transition-all">
                <i data-lucide="play-circle" class="w-4 h-4"></i> Game Center
            </button>
            
            <div class="pt-8 px-4">
                <h4 class="text-[10px] font-black text-slate-600 uppercase tracking-[0.2em] mb-4">Quick Stats</h4>
                <div id="quick-stats-box" class="space-y-4">
                    </div>
            </div>
        </aside>

        <main id="view-port" class="flex-1 space-y-8">
            </main>
    </div>

    <script>
        const DATA_URL = 'https://raw.githubusercontent.com/SuppliedOwner/nj-volleyball-tracker/main/data.json';
        const MESSAGES = [
            "NJ's elite platform for strength-of-schedule analytics.",
            "Track every set, kill, and block across the Garden State.",
            "Advanced SOS algorithms for verified state rankings.",
            "The central hub for NJ High School volleyball intelligence."
        ];

        let db = { teams: [], playerStats: {kills:[], aces:[], blocks:[]}, matches: [], lastUpdated: '' };
        let currentTab = 'home';
        let msgIndex = 0;

        async function init() {
            try {
                const res = await fetch(DATA_URL);
                db = await res.json();
                render();
                startRotator();
            } catch (e) { console.error("Database error."); }
        }

        function setTab(t) {
            currentTab = t;
            render();
        }

        function startRotator() {
            setInterval(() => {
                msgIndex = (msgIndex + 1) % MESSAGES.length;
                const el = document.getElementById('rotating-sub');
                if(el) {
                    el.style.opacity = 0;
                    setTimeout(() => {
                        el.innerText = MESSAGES[msgIndex] + " | " + db.lastUpdated;
                        el.style.opacity = 1;
                    }, 500);
                }
            }, 45000);
        }

        function render() {
            const vp = document.getElementById('view-port');
            const qb = document.getElementById('quick-stats-box');
            
            // Sidebar UI update
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(`btn-${currentTab}`).classList.add('active-tab');

            // Quick Stats Sidebar
            qb.innerHTML = `
                <div class="p-4 rounded-2xl bg-slate-900/40 border border-white/5">
                    <div class="text-[9px] font-black text-slate-500 uppercase">Top Program</div>
                    <div class="text-xs font-black uppercase mt-1 truncate">${db.teams[0]?.name || '--'}</div>
                </div>
                <div class="p-4 rounded-2xl bg-slate-900/40 border border-white/5">
                    <div class="text-[9px] font-black text-slate-500 uppercase">Active Games</div>
                    <div class="text-xs font-black uppercase mt-1">${db.matches.length} tracked</div>
                </div>
            `;

            if (currentTab === 'home') {
                vp.innerHTML = `
                    <div class="glass-card p-10 md:p-16 rounded-[40px] relative overflow-hidden purple-glow">
                        <div class="absolute top-0 right-0 w-1/2 h-full bg-purple-600/5 blur-[120px] rounded-full"></div>
                        <div class="relative z-10">
                            <span class="px-4 py-1.5 bg-purple-500/10 text-purple-400 text-[10px] font-black uppercase tracking-widest rounded-full border border-purple-500/20">NJVB Intelligence</span>
                            <h1 class="text-6xl md:text-8xl font-black uppercase italic tracking-tighter mt-6 leading-[0.85]">STATE <br/><span class="text-purple-500">POWER INDEX</span></h1>
                            <p class="text-slate-400 mt-8 text-sm md:text-lg max-w-xl font-medium leading-relaxed">${MESSAGES[0]}</p>
                            <div class="flex gap-4 mt-10">
                                <button onclick="setTab('rankings')" class="px-8 py-4 bg-purple-600 text-white rounded-2xl font-black text-xs uppercase tracking-widest hover:scale-105 transition-all shadow-xl shadow-purple-900/30">View Top 100</button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="glass-card p-8 rounded-[32px]">
                            <h3 class="text-[10px] font-black uppercase text-slate-500 tracking-widest mb-6 flex items-center gap-2"><i data-lucide="award" class="w-4 h-4 text-purple-500"></i> Top Rated Program</h3>
                            <div class="flex items-center gap-4">
                                <img src="${db.teams[0]?.logo}" class="w-16 h-16 rounded-2xl bg-slate-900 p-2 object-contain border border-white/5">
                                <div>
                                    <div class="text-2xl font-black uppercase italic">${db.teams[0]?.name}</div>
                                    <div class="text-[10px] font-bold text-slate-500 uppercase">${db.teams[0]?.conference}</div>
                                </div>
                            </div>
                        </div>
                        <div class="glass-card p-8 rounded-[32px]">
                            <h3 class="text-[10px] font-black uppercase text-slate-500 tracking-widest mb-6 flex items-center gap-2"><i data-lucide="flame" class="w-4 h-4 text-orange-500"></i> State Kill Leader</h3>
                            <div class="text-2xl font-black uppercase italic">${db.playerStats.kills[0]?.name || '---'}</div>
                            <div class="text-sm font-bold text-purple-500 mt-1">${db.playerStats.kills[0]?.value || '0'} Total Kills</div>
                        </div>
                    </div>
                `;
            }

            if (currentTab === 'rankings') {
                vp.innerHTML = `
                    <div class="glass-card rounded-[32px] overflow-hidden">
                        <div class="p-8 border-b border-white/5 flex flex-col md:flex-row justify-between items-end gap-4">
                            <div>
                                <h2 class="text-3xl font-black uppercase italic tracking-tighter">Statewide Top 100</h2>
                                <p class="text-[10px] font-bold text-slate-500 uppercase mt-1">Strength of Schedule (SOS) Indexed</p>
                            </div>
                        </div>
                        <div class="overflow-x-auto no-scrollbar">
                            <table class="w-full text-left">
                                <thead class="bg-slate-900/50 text-[10px] font-black uppercase text-slate-500">
                                    <tr>
                                        <th class="px-8 py-6">Rank</th>
                                        <th class="px-8 py-6">School / Conference</th>
                                        <th class="px-8 py-6 text-center">Record</th>
                                        <th class="px-8 py-6 text-right">SOS Index</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-white/5">
                                    ${db.teams.map(t => `
                                        <tr class="hover:bg-white/5 transition-colors group">
                                            <td class="px-8 py-8">
                                                <div class="flex items-center gap-4">
                                                    <span class="text-2xl font-black italic text-slate-700">#${t.rank}</span>
                                                    ${renderMovement(t.movement)}
                                                </div>
                                            </td>
                                            <td class="px-8 py-8">
                                                <div class="flex items-center gap-4">
                                                    <img src="${t.logo}" class="w-10 h-10 rounded-xl bg-slate-900 p-1 border border-white/5 object-contain" onerror="this.src='https://ui-avatars.com/api/?name=${t.name}&background=9333ea&color=fff'">
                                                    <div>
                                                        <a href="${t.url}" target="_blank" class="font-black uppercase text-sm tracking-tight hover:text-purple-400 transition-colors">${t.name}</a>
                                                        <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">${t.conference}</div>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="px-8 py-8 text-center">
                                                <span class="px-4 py-1.5 bg-black/40 rounded-xl border border-white/10 text-[10px] font-black italic tracking-widest text-slate-400 uppercase">
                                                    ${t.record.replace('-', ' — ')}
                                                </span>
                                            </td>
                                            <td class="px-8 py-8 text-right font-black text-purple-400 italic text-lg">${t.sos}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            if (currentTab === 'stats') {
                vp.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        ${renderStatCard("Kills Leaderboard", db.playerStats.kills, "Kills")}
                        ${renderStatCard("Aces Leaderboard", db.playerStats.aces, "Aces")}
                        ${renderStatCard("Blocks Leaderboard", db.playerStats.blocks, "Blocks")}
                    </div>
                `;
            }

            if (currentTab === 'matches') {
                vp.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${db.matches.map(m => `
                            <div class="glass-card p-8 rounded-[32px] group relative overflow-hidden">
                                <div class="absolute top-0 right-0 w-24 h-24 bg-purple-600/5 blur-3xl pointer-events-none"></div>
                                <div class="flex justify-between items-center mb-8">
                                    <span class="text-[9px] font-black uppercase text-slate-500 border border-white/10 px-2 py-1 rounded">Match Log</span>
                                    <span class="text-[9px] font-black uppercase text-green-500">${m.status}</span>
                                </div>
                                <div class="space-y-6">
                                    <div class="flex justify-between items-center">
                                        <span class="font-black uppercase text-sm">${m.away}</span>
                                        <span class="text-2xl font-black italic text-purple-500">${m.awayScore}</span>
                                    </div>
                                    <div class="h-px bg-white/5 w-full"></div>
                                    <div class="flex justify-between items-center">
                                        <span class="font-black uppercase text-sm">${m.home}</span>
                                        <span class="text-2xl font-black italic">${m.homeScore}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function renderMovement(m) {
            if (m > 0) return `<span class="text-green-500 text-[10px] font-black">▲ ${m}</span>`;
            if (m < 0) return `<span class="text-red-500 text-[10px] font-black">▼ ${Math.abs(m)}</span>`;
            return `<span class="text-slate-800 text-[10px] font-black">--</span>`;
        }

        function renderStatCard(title, list, label) {
            return `
                <div class="glass-card p-8 rounded-[32px]">
                    <h3 class="text-lg font-black uppercase italic mb
