<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJVB | Central Intelligence Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .active-nav { background: rgba(147, 51, 234, 0.1); color: #c084fc; border-right: 3px solid #9333ea; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen overflow-hidden">

    <div class="flex h-screen overflow-hidden">
        
        <aside class="w-80 glass-panel border-r border-white/5 flex flex-col shrink-0 hidden lg:flex">
            <div class="p-8 border-b border-white/5">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-purple-600 rounded-2xl shadow-2xl shadow-purple-900/40">
                        <i data-lucide="zap" class="w-6 h-6 text-white fill-white/20"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black tracking-tighter uppercase italic leading-none">NJVB<span class="text-purple-500">HUB</span></h1>
                        <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-1">State Intelligence</p>
                    </div>
                </div>
            </div>

            <nav class="flex-1 p-6 space-y-1.5">
                <button onclick="setTab('home')" id="nav-home" class="w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all text-slate-400 hover:bg-white/5 active-nav">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i> Dashboard
                </button>
                <button onclick="setTab('rankings')" id="nav-rankings" class="w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all text-slate-400 hover:bg-white/5">
                    <i data-lucide="list-ordered" class="w-4 h-4"></i> Power Rankings
                </button>
                <button onclick="setTab('stats')" id="nav-stats" class="w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all text-slate-400 hover:bg-white/5">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Stat Leaders
                </button>
                <button onclick="setTab('matches')" id="nav-matches" class="w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all text-slate-400 hover:bg-white/5">
                    <i data-lucide="play-circle" class="w-4 h-4"></i> Game Center
                </button>
            </nav>

            <div class="p-6 border-t border-white/5 space-y-4">
                <div class="p-4 rounded-2xl bg-slate-900/40 border border-white/5">
                    <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Global Status</p>
                    <div class="flex items-center gap-2 mt-2">
                        <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                        <span class="text-[10px] font-bold text-slate-300 italic uppercase" id="sync-label">Syncing Live...</span>
                    </div>
                </div>
                <button class="w-full py-4 bg-slate-900 border border-white/10 rounded-2xl flex items-center justify-center gap-2 text-[10px] font-black uppercase tracking-widest hover:bg-slate-800 transition-all text-slate-300">
                    <i data-lucide="plus" class="w-3 h-3 text-purple-500"></i> Verify Match
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col min-w-0">
            <header class="h-24 border-b border-white/5 flex items-center justify-between px-10 shrink-0 bg-[#020617]/50 backdrop-blur-md">
                <div class="flex flex-col">
                    <p id="rotating-msg" class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.15em] transition-opacity duration-500">
                        Initializing Garden State Intelligence...
                    </p>
                </div>
                <div class="flex items-center gap-6">
                    <div class="hidden md:flex flex-col text-right">
                        <span class="text-[10px] font-black text-slate-500 uppercase">Database Alpha</span>
                        <span id="header-sync" class="text-[10px] font-bold text-purple-400 uppercase">...</span>
                    </div>
                    <div class="h-10 w-px bg-white/5"></div>
                    <div class="w-10 h-10 rounded-xl bg-purple-600/20 border border-purple-500/20 flex items-center justify-center">
                        <i data-lucide="shield-check" class="w-5 h-5 text-purple-500"></i>
                    </div>
                </div>
            </header>

            <div id="content-body" class="flex-1 overflow-y-auto p-6 md:p-10 custom-scrollbar space-y-10">
                </div>
        </main>
    </div>

    <script>
        const DATA_URL = 'https://raw.githubusercontent.com/SuppliedOwner/nj-volleyball-tracker/main/data.json';
        const MESSAGES = [
            "NJ's elite platform for strength-of-schedule analytics.",
            "Track every set, kill, and block across the state.",
            "Advanced SOS algorithms for verified state rankings.",
            "Live intelligence sourced from state-wide databases."
        ];

        let db = { teams: [], playerStats: {kills:[], aces:[], blocks:[]}, matches: [], lastUpdated: '' };
        let currentTab = 'home';
        let msgIdx = 0;

        async function init() {
            try {
                const res = await fetch(DATA_URL);
                db = await res.json();
                document.getElementById('header-sync').innerText = db.lastUpdated || 'Live';
                render();
                startMessenger();
            } catch (e) { console.error("Database connection failed."); }
        }

        function startMessenger() {
            setInterval(() => {
                msgIdx = (msgIdx + 1) % MESSAGES.length;
                const el = document.getElementById('rotating-msg');
                el.style.opacity = 0;
                setTimeout(() => {
                    el.innerText = MESSAGES[msgIdx];
                    el.style.opacity = 1;
                }, 500);
            }, 15000);
        }

        function setTab(t) { currentTab = t; render(); }

        function render() {
            const body = document.getElementById('content-body');
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active-nav'));
            document.getElementById(`nav-${currentTab}`).classList.add('active-nav');

            if (currentTab === 'home') {
                body.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 p-12 rounded-[48px] bg-gradient-to-br from-purple-900/20 to-slate-900/50 border border-white/5 relative overflow-hidden group">
                            <div class="absolute top-0 right-0 w-80 h-80 bg-purple-500/10 blur-[120px] rounded-full transition-all group-hover:bg-purple-500/20"></div>
                            <div class="relative z-10">
                                <span class="bg-purple-500/10 text-purple-400 text-[10px] font-black px-4 py-1.5 rounded-full uppercase border border-purple-500/20 tracking-[0.2em]">Live Feed Active</span>
                                <h2 class="text-6xl md:text-8xl font-black uppercase italic tracking-tighter mt-8 leading-[0.8] transition-transform">
                                    THE STATE <br/><span class="text-purple-500">POWER INDEX.</span>
                                </h2>
                                <p class="text-slate-400 mt-10 text-sm md:text-lg font-medium max-w-md leading-relaxed">
                                    ${MESSAGES[0]}
                                </p>
                            </div>
                        </div>
                        <div class="p-10 rounded-[48px] glass-panel flex flex-col justify-between border border-white/5">
                            <h3 class="text-[10px] font-black uppercase text-slate-500 tracking-[0.2em] flex items-center gap-2"><i data-lucide="award" class="w-4 h-4 text-purple-500"></i> Top Ranked Program</h3>
                            <div class="mt-4">
                                <div class="text-3xl font-black uppercase italic leading-tight">${db.teams[0]?.name || '---'}</div>
                                <div class="text-[10px] font-bold text-slate-500 mt-2 uppercase tracking-widest">${db.teams[0]?.conference || 'Independent'}</div>
                            </div>
                            <div class="mt-8 pt-8 border-t border-white/5">
                                <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">SOS Performance</div>
                                <div class="text-3xl font-black text-white italic">${db.teams[0]?.sos || '0.00'}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        ${renderSummaryCard("Active Matches", db.matches.length, "satellite", "text-blue-400")}
                        ${renderSummaryCard("Kill Leader", db.playerStats.kills[0]?.value || 0, "flame", "text-orange-500")}
                        ${renderSummaryCard("Aces Tracked", db.playerStats.aces[0]?.value || 0, "zap", "text-yellow-400")}
                        ${renderSummaryCard("Blocks Noted", db.playerStats.blocks[0]?.value || 0, "shield", "text-green-400")}
                    </div>
                `;
            }

            if (currentTab === 'rankings') {
                body.innerHTML = `
                    <div class="glass-panel rounded-[40px] overflow-hidden border border-white/5">
                        <div class="p-10 border-b border-white/5 flex flex-col md:flex-row justify-between items-end gap-4">
                            <div>
                                <h2 class="text-4xl font-black uppercase italic tracking-tighter">NJ Top 100 Rankings</h2>
                                <p class="text-[10px] font-bold text-slate-500 uppercase mt-2 tracking-widest">Strength of Schedule (SOS) Analytics</p>
                            </div>
                        </div>
                        <div class="overflow-x-auto custom-scrollbar">
                            <table class="w-full text-left">
                                <thead class="bg-slate-900/40 text-[10px] font-black uppercase tracking-[0.2em] text-slate-500">
                                    <tr>
                                        <th class="px-10 py-6">Rank</th>
                                        <th class="px-10 py-6">Program / Conference</th>
                                        <th class="px-10 py-6 text-center">Record</th>
                                        <th class="px-10 py-6 text-right">SOS Rating</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-white/5">
                                    ${db.teams.map(t => `
                                        <tr class="hover:bg-white/5 transition-all group">
                                            <td class="px-10 py-8">
                                                <div class="flex items-center gap-4">
                                                    <span class="text-3xl font-black italic text-slate-800 group-hover:text-purple-500 transition-colors">#${t.rank}</span>
                                                    ${renderMove(t.movement)}
                                                </div>
                                            </td>
                                            <td class="px-10 py-8">
                                                <div class="flex items-center gap-5">
                                                    <img src="${t.logo}" class="w-12 h-12 rounded-2xl bg-slate-900 p-2 border border-white/5 object-contain" onerror="this.src='https://ui-avatars.com/api/?name=${t.name}&background=9333ea&color=fff'">
                                                    <div>
                                                        <a href="${t.url}" target="_blank" class="font-black uppercase text-sm tracking-tight hover:text-purple-400 transition-colors">${t.name}</a>
                                                        <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest mt-1">${t.conference}</div>
                                                    </div>
                                                </div>
                                            </td>
                                            <td class="px-10 py-8 text-center">
                                                <span class="px-5 py-2 bg-black/40 rounded-2xl border border-white/10 text-[10px] font-black italic tracking-widest text-slate-400">
                                                    ${t.record.replace('-', ' — ')}
                                                </span>
                                            </td>
                                            <td class="px-10 py-8 text-right font-black text-purple-400 italic text-2xl">${t.sos}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            if (currentTab === 'stats') {
                body.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        ${renderStatList("Kills Leaderboard", db.playerStats.kills, "Kills")}
                        ${renderStatList("Service Aces", db.playerStats.aces, "Aces")}
                        ${renderStatList("Defensive Blocks", db.playerStats.blocks, "Blocks")}
                    </div>
                `;
            }

            if (currentTab === 'matches') {
                body.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        ${db.matches.map(m => `
                            <div class="glass-panel p-10 rounded-[48px] group relative overflow-hidden border border-white/5">
                                <div class="flex justify-between items-center mb-10">
                                    <span class="text-[10px] font-black uppercase text-slate-500 tracking-widest">State Match Log</span>
                                    <span class="text-[10px] font-black uppercase text-green-500 bg-green-500/10 px-3 py-1 rounded-full border border-green-500/20">${m.status}</span>
                                </div>
                                <div class="space-y-8">
                                    <div class="flex justify-between items-center">
                                        <span class="font-black uppercase text-base truncate pr-4 text-slate-300">${m.away}</span>
                                        <span class="text-4xl font-black italic text-purple-500">${m.awayScore}</span>
                                    </div>
                                    <div class="h-px bg-white/5 w-full"></div>
                                    <div class="flex justify-between items-center">
                                        <span class="font-black uppercase text-base truncate pr-4 text-white">${m.home}</span>
                                        <span class="text-4xl font-black italic">${m.homeScore}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function renderSummaryCard(title, val, icon, color) {
            return `
                <div class="glass-panel p-8 rounded-[40px] border border-white/5">
                    <div class="flex items-center gap-3 mb-4">
                        <i data-lucide="${icon}" class="w-4 h-4 ${color}"></i>
                        <span class="text-[10px] font-black uppercase text-slate-500 tracking-widest">${title}</span>
                    </div>
                    <div class="text-3xl font-black italic uppercase">${val}</div>
                </div>
            `;
        }

        function renderMove(m) {
            if (m > 0) return `<span class="text-green-500 text-[10px] font-black bg-green-500/10 px-2 py-0.5 rounded-full">▲ ${m}</span>`;
            if (m < 0) return `<span class="text-red-500 text-[10px] font-black bg-red-500/10 px-2 py-0.5 rounded-full">▼ ${Math.abs(m)}</span>`;
            return `<span class="text-slate-800 text-[10px] font-black">--</span>`;
        }

        function renderStatList(t, list, label) {
            return `
                <div class="glass-panel p-10 rounded-[48px] border border-white/5">
                    <h3 class="text-xl font-black uppercase italic mb-10 border-b border-white/5 pb-5">${t}</h3>
                    <div class="space-y-4">
                        ${list.map((p, i) => `
                            <div class="flex justify-between items-center p-5 bg-slate-900/40 rounded-3xl border border-white/5 hover:border-purple-500/20 transition-all group">
                                <div class="flex items-center gap-4">
                                    <span class="text-[11px] font-black text-slate-700 group-hover:text-purple-500 transition-colors">${i+1}</span>
                                    <div>
                                        <div class="font-black text-sm uppercase text-slate-200 truncate w-32">${p.name}</div>
                                        <div class="text-[9px] font-bold text-slate-500 uppercase truncate w-32">${p.school}</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-2xl font-black italic text-purple-500 leading-none">${p.value}</div>
                                    <div class="text-[8px] font-black text-slate-600 uppercase mt-1 tracking-widest">${label}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
