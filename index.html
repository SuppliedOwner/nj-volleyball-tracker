<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>NJVB CARTEL | THE GOSPEL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background: #050505; color: #eee; font-family: 'Inter', sans-serif; }
        .gold-glow { box-shadow: 0 0 15px #fbbf24; border: 2px solid #fbbf24 !important; }
        .card-grad { background: linear-gradient(145deg, #111, #080808); }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [tab, setTab] = useState('Main');
            const [data, setData] = useState({ teams: [], matches: [], conferences: [] });
            const [confTab, setConfTab] = useState('Shore');

            useEffect(() => {
                fetch('./data.json').then(r => r.json()).then(setData);
            }, []);

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-8">
                    {/* NAV */}
                    <nav className="flex gap-8 mb-12 border-b border-zinc-800 pb-4 justify-between items-center">
                        <h1 className="text-2xl font-black italic text-purple-600">NJVB CARTEL</h1>
                        <div className="flex gap-6 font-bold text-xs uppercase tracking-widest">
                            {['Main', 'Rankings', 'Matches'].map(t => (
                                <button key={t} onClick={() => setTab(t)} className={tab === t ? 'text-white border-b-2 border-purple-600' : 'text-zinc-500'}>{t}</button>
                            ))}
                        </div>
                    </nav>

                    {/* MAIN OVERVIEW */}
                    {tab === 'Main' && (
                        <div className="animate-in fade-in duration-500">
                            <h2 className="text-sm font-black text-zinc-500 uppercase mb-4 tracking-tighter">Recent Heat</h2>
                            <div className="flex gap-4 overflow-x-auto pb-6 hide-scroll">
                                {data.matches.slice(0, 5).map((m, i) => (
                                    <div key={i} className="min-w-[280px] card-grad border border-zinc-800 p-6 rounded-2xl">
                                        <div className="flex justify-between items-center mb-4 text-[10px] font-black text-zinc-600 uppercase"><span>{m.date}</span> <span className="text-green-500">FINAL</span></div>
                                        <div className="flex justify-between font-black text-lg"><span>{m.home}</span> <span className="text-purple-500">{m.score.split('-')[0]}</span></div>
                                        <div className="flex justify-between font-black text-lg"><span>{m.away}</span> <span className="text-purple-500">{m.score.split('-')[1]}</span></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* RANKINGS SECTION */}
                    {tab === 'Rankings' && (
                        <div className="space-y-12">
                            {/* OVERALL */}
                            <section>
                                <h3 className="text-4xl font-black uppercase italic mb-6">State Top 100</h3>
                                <div className="bg-[#111] rounded-2xl border border-zinc-800 overflow-hidden">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-zinc-900 text-zinc-500 font-black uppercase">
                                            <tr><th className="p-4">#</th><th className="p-4">Team</th><th className="p-4">Record</th><th className="p-4">SOS</th><th className="p-4">Mvmt</th></tr>
                                        </thead>
                                        <tbody>
                                            {data.teams.map((t, i) => (
                                                <tr key={i} className="border-t border-zinc-800 hover:bg-zinc-900 transition-colors cursor-pointer">
                                                    <td className="p-4 font-black">{t.rank}</td>
                                                    <td className="p-4 font-black text-purple-400">{t.name}</td>
                                                    <td className="p-4">{t.record}</td>
                                                    <td className="p-4 text-zinc-500 font-bold">{t.sos}</td>
                                                    <td className={`p-4 font-black ${t.movement > 0 ? 'text-green-500' : 'text-red-500'}`}>{t.movement > 0 ? `▲${t.movement}` : t.movement < 0 ? `▼${Math.abs(t.movement)}` : '—'}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </section>

                            {/* CONFERENCES */}
                            <section>
                                <h3 className="text-2xl font-black uppercase mb-6 text-zinc-400">Conference Standing</h3>
                                <div className="flex gap-2 overflow-x-auto mb-6 hide-scroll">
                                    {data.conferences.map(c => (
                                        <button key={c} onClick={() => setConfTab(c)} className={`px-4 py-2 rounded-full text-[10px] font-black uppercase transition-all ${confTab === c ? 'bg-white text-black' : 'bg-zinc-900 text-zinc-500'}`}>{c}</button>
                                    ))}
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {data.teams.filter(t => t.conference === confTab).map((t, i) => (
                                        <div key={i} className={`p-6 rounded-2xl card-grad border border-zinc-800 ${i === 0 ? 'gold-glow' : ''}`}>
                                            <div className="text-[10px] font-black text-zinc-600 mb-1">POS: {i + 1}</div>
                                            <div className="text-xl font-black uppercase truncate">{t.name}</div>
                                            <div className="text-sm font-bold text-purple-500 mt-2">{t.record}</div>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        </div>
                    )}

                    {/* WEEKLY SCHEDULE */}
                    {tab === 'Matches' && (
                        <div className="grid gap-4">
                            <h3 className="text-4xl font-black uppercase italic mb-6">Battle Calendar</h3>
                            {data.matches.map((m, i) => (
                                <div key={i} className="flex items-center justify-between p-6 bg-[#111] border border-zinc-800 rounded-2xl">
                                    <div className="w-24 text-xs font-black text-zinc-500">{m.date}</div>
                                    <div className="flex-1 flex justify-center gap-8 font-black uppercase text-sm">
                                        <span>{m.home}</span>
                                        <span className="text-purple-600 italic">@</span>
                                        <span>{m.away}</span>
                                    </div>
                                    <div className="w-24 text-right text-[10px] font-black text-zinc-600 uppercase">League Play</div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
