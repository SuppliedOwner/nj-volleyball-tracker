<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJVB | Central Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #020617; color: #f8fafc; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .active-nav { background: rgba(147, 51, 234, 0.1); color: #c084fc; border-right: 2px solid #9333ea; }
        .transition-all { transition: all 0.3s ease; }
    </style>
</head>
<body class="min-h-screen">

    <div class="flex flex-col md:flex-row min-h-screen">
        <aside class="w-full md:w-80 glass-panel border-r border-white/5 flex flex-col shrink-0">
            <div class="p-8 border-b border-white/5">
                <div class="flex items-center gap-3">
                    <div class="p-2.5 bg-purple-600 rounded-2xl shadow-xl shadow-purple-900/40">
                        <i data-lucide="zap" class="w-6 h-6 text-white fill-white/20"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black tracking-tighter uppercase italic">NJVB<span class="text-purple-500">HUB</span></h1>
                        <p class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">State Intelligence</p>
                    </div>
                </div>
            </div>

            <nav class="flex-1 p-6 space-y-2">
                <button onclick="setTab('home')" id="nav-home" class="w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all text-slate-400 hover:bg-white/5">
                    <i data-lucide="layout-grid" class="w-4 h-4"></i> Dashboard
                </button>
                <button onclick="setTab('rankings')" id="nav-rankings" class="w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all text-slate-400 hover:bg-white/5">
                    <i data-lucide="list-ordered" class="w-4 h-4"></i> Power Rankings
                </button>
                <button onclick="setTab('stats')" id="nav-stats" class="w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all text-slate-400 hover:bg-white/5">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Stat Leaders
                </button>
                <button onclick="setTab('matches')" id="nav-matches" class="w-full flex items-center gap-3 px-5 py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all text-slate-400 hover:bg-white/5">
                    <i data-lucide="play-circle" class="w-4 h-4"></i> Game Center
                </button>
            </nav>

            <div class="p-6 border-t border-white/5">
                <button class="w-full py-4 bg-slate-900 border border-white/10 rounded-2xl flex items-center justify-center gap-2 text-[10px] font-black uppercase tracking-widest hover:bg-slate-800 transition-all">
                    <i data-lucide="plus" class="w-3 h-3"></i> Verify Match
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <header class="h-24 border-b border-white/5 flex items-center justify-between px-10 shrink-0">
                <div class="max-w-2xl">
                    <p id="rotating-msg" class="text-[11px] font-bold text-slate-500 uppercase tracking-widest transition-opacity duration-500">
                        Siphoning data...
                    </p>
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 px-4 py-2 bg-slate-900/50 rounded-full border border-white/5">
                        <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                        <span id="sync-time" class="text-[9px] font-black text-slate-400 uppercase tracking-widest italic">Live</span>
                    </div>
                </div>
            </header>

            <div id="content-body" class="flex-1 overflow-y-auto p-10 space-y-10 custom-scrollbar">
                </div>
        </main>
    </div>

    <script>
        const DATA_URL = 'https://raw.githubusercontent.com/SuppliedOwner/nj-volleyball-tracker/main/data.json';
        const SHUFFLE_MESSAGES = [
            "NJ's elite platform for strength-of-schedule analytics and real-time volleyball intelligence.",
            "Track every set, kill, and block from High Point to Cape May in real-time.",
            "The central hub for Garden State volleyball news and verified match reports."
        ];

        let db = { teams: [], playerStats: {kills:[], aces:[], blocks:[]}, matches: [], lastUpdated: '' };
        let currentTab = 'home';
        let msgIdx = 0;

        async function load() {
            try {
                const res = await fetch(DATA_URL);
                db = await res.json();
                document.getElementById('sync-time').innerText = `Last Sync: ${db.lastUpdated}`;
                render();
            } catch (e) { console.error("Sync failure"); }
        }

        setInterval(() => {
            msgIdx = (msgIdx + 1) % SHUFFLE_MESSAGES.length;
            const el = document.getElementById('rotating-msg');
            if(el) {
                el.style.opacity = 0;
                setTimeout(() => {
                    el.innerText = SHUFFLE_MESSAGES[msgIdx];
                    el.style.opacity = 1;
                }, 500);
            }
        }, 45000);

        function setTab(t) { currentTab = t; render(); }

        function render() {
            const body = document.getElementById('content-body');
            document.querySelectorAll('nav button').forEach(b => b.className = b.className.replace('active-nav', ''));
            document.getElementById(`nav-${currentTab}`).classList.add('active-nav');

            if (currentTab === 'home') {
                body.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 p-12 rounded-[40px] bg-gradient-to-br from-purple-900/20 to-slate-900/50 border border-white/5 relative overflow-hidden">
                            <div class="absolute top-0 right-0 w-64 h-64 bg-purple-500/10 blur-[100px]"></div>
                            <div class="relative z-10">
                                <span class="bg-purple-500/10 text-purple-400 text-[10px] font-black px-4 py-1.5 rounded-full uppercase border border-purple-500/20 tracking-widest">Database Alpha</span>
                                <h2 class="text-6xl font-black uppercase italic tracking-tighter mt-6 leading-none">The Pulse of <br/><span class="text-purple-500">NJ Volleyball.</span></h2>
                                <p class="text-slate-400 mt-8 text-sm font-medium max-w-md">${SHUFFLE_MESSAGES[0]}</p>
                            </div>
                        </div>
                        <div class="p-8 rounded-[40px] glass-panel flex flex-col justify-between">
                            <h3 class="text-[10px] font-black uppercase text-slate-500 tracking-widest flex items-center gap-2"><i data-lucide="award"></i> State #1</h3>
                            <div class="mt-4">
                                <div class="text-3xl font-black uppercase italic">${db.teams[0]?.name || '---'}</div>
                                <div class="text-xs font-bold text-purple-500 mt-1 uppercase">${db.teams[0]?.conference || ''}</div>
                            </div>
                            <div class="mt-8 pt-8 border-t border-white/5">
                                <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1">SOS Index</div>
                                <div class="text-2xl font-black text-white italic">${db.teams[0]?.sos || '0.00'}</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (currentTab === 'rankings') {
                body.innerHTML = `
                    <div class="glass-panel rounded-[32px] overflow-hidden">
                        <div class="p-8 border-b border-white/5 flex justify-between items-center bg-white/2">
                            <h2 class="text-2xl font-black uppercase italic tracking-tighter">NJ State Top 100</h2>
                            <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Verified Ratings Only</span>
                        </div>
                        <table class="w-full text-left">
                            <thead class="bg-slate-900/40 text-[9px] font-black uppercase tracking-[0.2em] text-slate-500">
                                <tr>
                                    <th class="px-8 py-6">Rank</th>
                                    <th class="px-8 py-6">School / Conference</th>
                                    <th class="px-8 py-6 text-center">Record</th>
                                    <th class="px-8 py-6 text-right">SOS</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-white/5">
                                ${db.teams.map(t => `
                                    <tr class="hover:bg-white/5 transition-all group">
                                        <td class="px-8 py-8">
                                            <div class="flex items-center gap-4">
                                                <span class="text-2xl font-black italic text-slate-700">#${t.rank}</span>
                                                ${renderMove(t.movement)}
                                            </div>
                                        </td>
                                        <td class="px-8 py-8">
                                            <div class="flex items-center gap-4">
                                                <img src="${t.logo}" class="w-10 h-10 rounded-xl bg-slate-900 p-1 border border-white/5 object-contain" onerror="this.src='https://ui-avatars.com/api/?name=${t.name}&background=9333ea&color=fff'">
                                                <div>
                                                    <a href="${t.url}" target="_blank" class="font-black uppercase text-sm tracking-tight hover:text-purple-400">${t.name}</a>
                                                    <div class="text-[9px] font-bold text-slate-500 uppercase tracking-widest">${t.conference}</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="px-8 py-8 text-center">
                                            <span class="px-4 py-1.5 bg-black/40 rounded-xl border border-white/10 text-[10px] font-black italic tracking-widest text-slate-400">
                                                ${t.record.replace('-', ' — ')}
                                            </span>
                                        </td>
                                        <td class="px-8 py-8 text-right font-black text-purple-400 italic text-lg">${t.sos}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            if (currentTab === 'stats') {
                body.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        ${renderStatBox("State Kill Leaders", db.playerStats.kills, "Kills")}
                        ${renderStatBox("Service Aces", db.playerStats.aces, "Aces")}
                        ${renderStatBox("Defensive Blocks", db.playerStats.blocks, "Blocks")}
                    </div>
                `;
            }

            if (currentTab === 'matches') {
                body.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        ${db.matches.map(m => `
                            <div class="glass-panel p-8 rounded-[32px] group relative overflow-hidden">
                                <div class="flex justify-between items-center mb-10">
                                    <span class="text-[9px] font-black uppercase text-slate-500">Live Match Tracker</span>
                                    <span class="text-[9px] font-black uppercase text-green-500">${m.status}</span>
                                </div>
                                <div class="space-y-6">
                                    <div class="flex justify-between items-center">
                                        <span class="font-black uppercase text-sm truncate pr-4">${m.away}</span>
                                        <span class="text-2xl font-black italic text-purple-500">${m.awayScore}</span>
                                    </div>
                                    <div class="h-px bg-white/5 w-full"></div>
                                    <div class="flex justify-between items-center">
                                        <span class="font-black uppercase text-sm truncate pr-4">${m.home}</span>
                                        <span class="text-2xl font-black italic">${m.homeScore}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function renderMove(m) {
            if (m > 0) return `<span class="text-green-500 text-[10px] font-black">▲ ${m}</span>`;
            if (m < 0) return `<span class="text-red-500 text-[10px] font-black">▼ ${Math.abs(m)}</span>`;
            return `<span class="text-slate-800 text-[10px] font-black">--</span>`;
        }

        function renderStatBox(t, list, label) {
            return `
                <div class="glass-panel p-8 rounded-[32px]">
                    <h3 class="text-lg font-black uppercase italic mb-8 border-b border-white/5 pb-4">${t}</h3>
                    <div class="space-y-4">
                        ${list.map((p, i) => `
                            <div class="flex justify-between items-center p-4 bg-slate-900/40 rounded-2xl border border-white/5">
                                <div class="flex items-center gap-3">
                                    <span class="text-[10px] font-black text-slate-700">${i+1}</span>
                                    <div>
                                        <div class="font-black text-xs uppercase truncate w-24">${p.name}</div>
                                        <div class="text-[8px] font-bold text-slate-500 uppercase truncate">${p.school}</div>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <div class="text-lg font-black italic text-purple-500">${p.value}</div>
                                    <div class="text-[8px] font-black text-slate-600 uppercase">${label}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        load();
    </script>
</body>
</html>
